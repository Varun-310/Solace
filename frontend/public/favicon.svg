<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#3A7D5C" />
  
  <!-- Subtle gradient glow -->
  <circle cx="50" cy="50" r="40" fill="url(#glow)" opacity="0.6" />
  
  <!-- The 'S' for Solace -->
  <path d="M 65 35 C 55 25, 35 25, 35 40 C 35 55, 65 50, 65 65 C 65 80, 45 80, 35 70" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Leaf Sparkle -->
  <path d="M 70 20 Q 80 20 80 30 Q 80 20 90 20 Q 80 20 80 10 Q 80 20 70 20 Z" 
        fill="#E9EDC9" />

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>
</svg>
